<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="shortcut icon" href="content/logo/LOGO.webp" type="image/x-icon" />
  <title>café hb</title>
</head>

<body>
  <div class="nav-mob">
    <a class="join-a logo-m" data-category="all" href="№">
      <h2>café
      </h2>
      <img src="content/logo/LOGO.webp" alt="Logo">
    </a>
  </div>
  <header>
    <nav>
      <ul class="mainNav">
        <li><a href="#" class="hover:underline" data-category="sandwiches">Сендвичи</a></li>
        <li><a href="#" class="hover:underline" data-category="burgers">Бургеры</a></li>
        <li><a href="#" class="hover:underline" data-category="drinks">Напитки</a></li>
        <li><a href="#" class="hover:underline" data-category="soups">Супы</a></li>
        <li class="logo-d"><a href="#" data-category="all"><img src="content/logo/LOGO.webp" alt="Logo" /></a></li>
        <li><a href="#" class="hover:underline" data-category="dishes">Горячие блюда</a></li>
        <li><a href="#" class="hover:underline" data-category="salads">Салаты</a></li>
        <li><a href="#" class="hover:underline" data-category="breakfast">Завтраки</a></li>
      </ul>
    </nav>
  </header>
  <div class="banner" data-category="all">
    <img src="content/logo/banner.webp" alt="">
  </div>
  <div class="main">
    <div class="hero">
      <p class="hero-subtitle"><span>café hb </span>— вкусно по-другому</p>
    </div>
    <div class="category-slider" id="categorySlider"></div>
    <div id="products-container"></div>
  </div>
  <footer>
    <div class="footer">
      <div class="footer-logo">
        <div class="ft-logo">
          <h2>café hb</h2>
        </div>
      </div>
      <div class="footer-info">
        <p>
          <a target="_blank" href="https://www.instagram.com/cafe.hb_dushanbe/">Instagram</a>
        </p>
        <a href="tel:+992940909009">+992 021615252</a>
        <p>© café hb</p>
        <p class="info-creator">created by <a target="_blank" href="https://xzrasul.vercel.app">xzrasul</a></p>
      </div>
    </div>
  </footer>
  <button class="back-to-top" id="backToTop" aria-label="Наверх"><img width="30px" src="content/logo/backToTop.webp"
      alt=""></button>
  <button class="rating-btn" id="ratingBtn" aria-label="Оценить">
    ⭐ Оценить нас
  </button>

  <!-- Форма оценки обслуживания -->
  <div class="rating-overlay" id="ratingOverlay">
    <div class="rating-form" id="ratingForm">
      <button class="rating-close" id="closeRatingBtn" aria-label="Закрыть">×</button>

      <div class="rating-header">
        <h3>Оцените нас</h3>
        <p>Ваша оценка помогает нам улучшать сервис</p>
      </div>

      <div class="rating-stars-container">
        <span class="rating-star" data-rating="1">⭐</span>
        <span class="rating-star" data-rating="2">⭐</span>
        <span class="rating-star" data-rating="3">⭐</span>
        <span class="rating-star" data-rating="4">⭐</span>
        <span class="rating-star" data-rating="5">⭐</span>
      </div>

      <textarea class="rating-comment" id="ratingComment" rows="4" placeholder="Напишите ваш отзыв"></textarea>

      <input class="rating-honeypot" id="ratingHoney" type="text" tabindex="-1" autocomplete="off" aria-hidden="true"
        style="position:absolute; left:-9999px; opacity:0;" />

      <button class="rating-submit-btn" id="submitRatingBtn">
        Отправить оценку
      </button>
    </div>
  </div>

  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
