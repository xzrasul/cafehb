<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>café hb — Напитки</title>
  <style>
    @font-face {
      font-family: 'FixelText';
      src: url('FixelAll/FixelText/FixelText-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'FixelText';
      src: url('FixelAll/FixelText/FixelText-Medium.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'FixelText';
      src: url('FixelAll/FixelText/FixelText-SemiBold.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
    }

    @font-face {
      font-family: 'FixelText';
      src: url('FixelAll/FixelText/FixelText-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
    }

    :root {
      --card-width: 260px;
      --card-height: 340px;
      --stage-size: 2600px;
      --origin-y: 1450px;
      --glow-size: 640px;
      --blue: #3561C0;
      --blue-light: #4A7BE0;
      --blue-pale: #7B9CE5;
    }

    @media (max-width: 768px) {
      :root {
        --card-width: min(60vw, 280px);
        --card-height: min(84vw, 360px);
        --stage-size: 1500px;
        --origin-y: 840px;
        --glow-size: 380px;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'FixelText', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: linear-gradient(135deg, #f0f4ff 0%, #faf6f0 50%, #f0f4ff 100%);
      color: #1a1a2e;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 22px 20px;
      user-select: none;
      position: relative;
    }

    /* Кнопка возврата в меню */
    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--blue);
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      padding: 10px 16px 10px 12px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(53, 97, 192, 0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .back-link:hover {
      transform: translateX(-2px);
      box-shadow: 0 6px 20px rgba(53, 97, 192, 0.22);
    }

    .back-link svg {
      width: 16px;
      height: 16px;
      stroke: var(--blue);
    }

    @media (max-width: 768px) {
      .back-link {
        top: 14px;
        left: 14px;
        padding: 8px 14px 8px 10px;
        font-size: 13px;
      }
    }

    /* Текстовый блок сверху */
    .header-info {
      text-align: center;
      margin-top: 46px;
      z-index: 10;
      pointer-events: none;
      max-width: 620px;
    }

    .header-info .eyebrow {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--blue-pale);
      margin-bottom: 6px;
    }

    .header-info h1 {
      font-size: 2.1rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, var(--blue), var(--blue-pale));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: opacity 0.25s ease;
      min-height: 1.2em;
    }

    .header-info .product-price {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, var(--blue), var(--blue-light));
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 5px 18px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(53, 97, 192, 0.25);
      letter-spacing: 0.4px;
      transition: opacity 0.25s ease;
      margin-bottom: 8px;
    }

    .header-info p.desc {
      color: #666;
      font-size: 0.95rem;
      line-height: 1.45;
      transition: opacity 0.25s ease;
      min-height: 1.4em;
    }

    @media (max-width: 768px) {
      .header-info {
        margin-top: 40px;
      }

      .header-info h1 {
        font-size: 1.4rem;
      }

      .header-info p.desc {
        font-size: 0.82rem;
      }
    }

    /* Барабан */
    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, 0);
      width: var(--stage-size);
      height: var(--stage-size);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      pointer-events: none;
    }

    .track {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transform-origin: center center;
      transition: transform 0.85s cubic-bezier(0.15, 0.85, 0.35, 1);
      will-change: transform;
      pointer-events: auto;
    }

    .card {
      position: absolute;
      width: var(--card-width);
      height: var(--card-height);
      left: calc(50% - (var(--card-width) / 2));
      top: calc(-1 * (var(--card-height) / 2));
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 18px 45px rgba(53, 97, 192, 0.18);
      transform-origin: center var(--origin-y);
      transition:
        transform 0.85s cubic-bezier(0.15, 0.85, 0.35, 1),
        filter 0.4s ease,
        opacity 0.4s ease,
        box-shadow 0.4s ease;
      cursor: pointer;
      will-change: transform, filter;
      filter: grayscale(0.35) brightness(0.94);
      opacity: 0.3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 18px 14px 14px;
      text-align: center;
    }

    .card.active {
      filter: none;
      opacity: 1;
      box-shadow: 0 22px 55px rgba(53, 97, 192, 0.32);
      border-color: rgba(53, 97, 192, 0.25);
    }

    .card.visible-neighbor {
      filter: grayscale(0.12) brightness(0.98);
      opacity: 0.72;
    }

    .card .card-image-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      min-height: 0;
    }

    .card img {
      max-width: 82%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(53, 97, 192, 0.18));
      pointer-events: none;
    }

    .card h3 {
      font-weight: 600;
      font-size: 14px;
      color: #222;
      margin-top: 10px;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card .mini-price {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--blue);
    }

    @media (max-width: 768px) {
      .card {
        border-radius: 18px;
        padding: 3px 3px 3px;
      }

      .card h3 {
        font-size: 12px;
        margin-top: 6px;
      }

      .card .mini-price {
        font-size: 11px;
        margin-top: 4px;
      }

      /* На мобильном отказываемся от "колеса" (rotate вокруг далёкой точки) —
         при большом числе напитков угол между карточками становится совсем
         маленьким и они наезжают друг на друга. Вместо этого показываем
         только одну активную карточку по центру, остальные уезжают за экран. */
      .stage {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: var(--card-height);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .track {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .card {
        top: calc(50% - (var(--card-height) / 2));
        transform-origin: center center;
        transition:
          transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.35s ease,
          filter 0.35s ease;
      }
    }

    /* Мягкое голубое свечение за активной карточкой */
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: var(--glow-size);
      height: var(--glow-size);
      background: radial-gradient(circle, rgba(53, 97, 192, 0.14) 0%, rgba(53, 97, 192, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* Стрелки навигации (десктоп) */
    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 15;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--blue), var(--blue-light));
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(53, 97, 192, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .nav-arrow:hover {
      transform: translateY(-50%) scale(1.08);
      box-shadow: 0 6px 22px rgba(53, 97, 192, 0.4);
    }

    .nav-arrow:active {
      transform: translateY(-50%) scale(0.94);
    }

    .nav-arrow:disabled {
      opacity: 0.35;
      cursor: default;
      transform: translateY(-50%);
      box-shadow: none;
    }

    .nav-arrow svg {
      width: 20px;
      height: 20px;
      stroke: #fff;
    }

    .nav-arrow.prev {
      left: 24px;
    }

    .nav-arrow.next {
      right: 24px;
    }

    @media (max-width: 768px) {
      .nav-arrow {
        display: none;
      }
    }

    /* Индикатор внизу */
    .scroll-indicator {
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .scroll-indicator .hint {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #8a94a8;
      text-align: center;
    }

    .scroll-indicator .counter {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: 0.5px;
    }

    @media (max-width: 768px) {
      .scroll-indicator .hint {
        font-size: 0.66rem;
      }
    }

    #product-desc {
      display: none !important;
    }
  </style>
</head>

<body>

  <a class="back-link" href="index.html" data-category="drinks">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6" />
    </svg>
    Меню
  </a>

  <div class="header-info">
    <span class="eyebrow">café hb</span>
    <h1 id="product-title">Загрузка…</h1>
    <span class="product-price" id="product-price">— c</span>
    <p class="desc" id="product-desc"></p>
  </div>

  <div class="glow"></div>

  <div class="stage">
    <div class="track" id="track"></div>
  </div>

  <button class="nav-arrow prev" id="prevBtn" aria-label="Предыдущий напиток">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6" />
    </svg>
  </button>
  <button class="nav-arrow next" id="nextBtn" aria-label="Следующий напиток">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 6l6 6-6 6" />
    </svg>
  </button>

  <div class="scroll-indicator">
    <span class="counter" id="counter">1 / 1</span>
    <span class="hint" id="nav-hint">Прокрутите колесо мыши или свайпните для выбора</span>
  </div>

  <script src="products.js"></script>
  <script>
    const track = document.getElementById("track");
    const titleEl = document.getElementById("product-title");
    const priceEl = document.getElementById("product-price");
    const descEl = document.getElementById("product-desc");
    const hintEl = document.getElementById("nav-hint");
    const counterEl = document.getElementById("counter");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const drinks = (typeof products !== "undefined" && products.drinks) ? products.drinks : [];

    let angleStep = 16; // шаг вращения в градусах

    let currentIndex = 0;
    let locked = false;
    let cards = [];

    // Подстраиваем угол шага и радиус "колеса" под количество напитков
    function applyGeometry(count) {
      const MAX_SWEEP = 260; // уменьшили угол разворота, чтобы карточки не уходили слишком далеко вниз
      const MAX_STEP = 16;
      const MIN_STEP = 5;    // минимальный шаг между карточками, чтобы они не слипались

      angleStep = count > 1
        ? Math.max(MIN_STEP, Math.min(MAX_STEP, MAX_SWEEP / (count - 1)))
        : MAX_STEP;

      const isMobile = window.matchMedia("(max-width: 768px)").matches;
      const baseOriginY = isMobile ? 840 : 1450;
      const baseStage = isMobile ? 1500 : 2600;

      // Чем больше товаров, тем сильнее увеличиваем радиус (умножаем на коэффициент плотности)
      const density = MAX_STEP / angleStep;
      const originY = Math.round(baseOriginY * (1 + (density - 1) * 0.45));
      const stageSize = Math.round(baseStage * (1 + (density - 1) * 0.45));

      document.documentElement.style.setProperty("--origin-y", `${originY}px`);
      document.documentElement.style.setProperty("--stage-size", `${stageSize}px`);
    }

    function isMobileView() {
      return window.matchMedia("(max-width: 768px)").matches;
    }

    let touchStartX = 0;
    let touchStartY = 0;

    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      hintEl.textContent = "Проведите пальцем для выбора";
    }

    function buildCards() {
      track.innerHTML = "";
      cards = drinks.map((drink, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.index = index;

        const imgWrap = document.createElement("div");
        imgWrap.className = "card-image-wrap";
        if (drink.image) {
          const img = document.createElement("img");
          img.src = drink.image;
          img.alt = drink.name;
          imgWrap.appendChild(img);
        }

        const h3 = document.createElement("h3");
        h3.textContent = drink.name;

        const price = document.createElement("span");
        price.className = "mini-price";
        price.textContent = `${drink.price} c`;

        card.append(imgWrap, h3, price);
        card.addEventListener("click", () => {
          if (index !== currentIndex) goToIndex(index);
        });

        track.appendChild(card);
        return card;
      });

      counterEl.textContent = `1 / ${drinks.length}`;
    }

    function updateCarousel() {
      const mobile = isMobileView();

      cards.forEach((card, index) => {
        const position = index - currentIndex;

        if (mobile) {
          // Простой слайд по центру: активная карточка на месте,
          // остальные уезжают за пределы экрана — наложений быть не может.
          if (position === 0) {
            card.style.transform = "translateX(0) scale(1)";
            card.style.opacity = "1";
            card.style.pointerEvents = "auto";
            card.style.zIndex = "5";
          } else {
            const dir = position > 0 ? 1 : -1;
            card.style.transform = `translateX(${dir * 130}%) scale(0.85)`;
            card.style.opacity = "0";
            card.style.pointerEvents = "none";
            card.style.zIndex = "1";
          }
        } else {
          const angle = position * angleStep;
          card.style.transform = `rotate(${angle}deg)`;
          card.style.opacity = "";
          card.style.pointerEvents = "";
          card.style.zIndex = "";
        }

        card.classList.remove('active', 'visible-neighbor');

        if (position === 0) {
          card.classList.add('active');
          updateText(drinks[index]);
        } else if (Math.abs(position) === 1) {
          card.classList.add('visible-neighbor');
        }
      });

      counterEl.textContent = `${currentIndex + 1} / ${drinks.length}`;
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === drinks.length - 1;
    }

    function updateText(drink) {
      titleEl.style.opacity = 0;
      priceEl.style.opacity = 0;
      descEl.style.opacity = 0;

      setTimeout(() => {
        titleEl.textContent = drink.name;
        priceEl.textContent = `${drink.price} c`;
        descEl.textContent = drink.description || "";
        titleEl.style.opacity = 1;
        priceEl.style.opacity = 1;
        descEl.style.opacity = 1;
      }, 150);
    }

    function goToIndex(index) {
      if (locked || !drinks.length) return;

      const targetIndex = Math.max(0, Math.min(index, drinks.length - 1));

      if (targetIndex !== currentIndex) {
        locked = true;
        currentIndex = targetIndex;
        updateCarousel();

        setTimeout(() => {
          locked = false;
        }, 750);
      }
    }

    /* ---- Управление: колесо мыши ---- */
    window.addEventListener("wheel", (e) => {
      if (locked) return;
      if (e.deltaY > 0) {
        goToIndex(currentIndex + 1);
      } else if (e.deltaY < 0) {
        goToIndex(currentIndex - 1);
      }
    }, { passive: true });

    /* ---- Управление: клавиатура ---- */
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") goToIndex(currentIndex + 1);
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") goToIndex(currentIndex - 1);
    });

    /* ---- Управление: кнопки-стрелки ---- */
    prevBtn.addEventListener("click", () => goToIndex(currentIndex - 1));
    nextBtn.addEventListener("click", () => goToIndex(currentIndex + 1));

    /* ---- Управление: свайп (мобильные) ---- */
    window.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener("touchend", (e) => {
      if (locked) return;

      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;

      const diffX = touchStartX - touchEndX;
      const diffY = touchStartY - touchEndY;

      const minSwipeDistance = 45;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (Math.abs(diffX) > minSwipeDistance) {
          if (diffX > 0) {
            goToIndex(currentIndex + 1);
          } else {
            goToIndex(currentIndex - 1);
          }
        }
      } else {
        if (Math.abs(diffY) > minSwipeDistance) {
          if (diffY > 0) {
            goToIndex(currentIndex + 1);
          } else {
            goToIndex(currentIndex - 1);
          }
        }
      }
    }, { passive: true });

    /* ---- Адаптивность при изменении экрана ---- */
    window.addEventListener("resize", () => {
      if (drinks.length) {
        applyGeometry(drinks.length);
        updateCarousel();
      }
    });

    /* ---- Запуск ---- */
    if (drinks.length) {
      applyGeometry(drinks.length); // <-- ТЕПЕРЬ ФУНКЦИЯ ВЫЗЫВАЕТСЯ ПРИ СТАРТЕ!
      buildCards();
      updateCarousel();
    } else {
      titleEl.textContent = "Напитки не найдены";
      descEl.textContent = "Проверьте подключение products.js";
      counterEl.textContent = "0 / 0";
      prevBtn.disabled = true;
      nextBtn.disabled = true;
    }
  </script>
</body>

</html>
