<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админ — cafe hb</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #f0f4ff; padding: 0; }
    .admin-wrap { max-width: 900px; margin: 0 auto; padding: 30px 20px 60px; }
    .admin-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 30px; flex-wrap: wrap; gap: 12px;
    }
    .admin-header h1 {
      font-size: 28px; margin: 0;
      background: linear-gradient(135deg, #3561C0, #7B9CE5);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .admin-card {
      background: #fff; border-radius: 16px; padding: 25px;
      box-shadow: 0 2px 20px rgba(53,97,192,0.08); margin-bottom: 25px;
    }
    .admin-card h2 { font-size: 20px; margin: 0 0 20px; color: #1a1a2e; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid .full-width { grid-column: 1 / -1; }
    .form-field { display: flex; flex-direction: column; gap: 4px; }
    .form-field label { font-size: 13px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-field input, .form-field select {
      font-family: 'FixelText', sans-serif; font-size: 15px; padding: 10px 14px;
      border: 2px solid #e0e5f0; border-radius: 10px; outline: none; transition: border-color 0.2s; background: #fafbff;
    }
    .form-field input:focus, .form-field select:focus { border-color: #3561C0; }
    .checkbox-field { display: flex; align-items: center; gap: 10px; padding-top: 22px; }
    .checkbox-field input { width: 18px; height: 18px; accent-color: #3561C0; }
    .checkbox-field label { font-size: 14px; font-weight: 500; color: #555; }
    .btn {
      font-family: 'FixelText', sans-serif; font-size: 15px; font-weight: 600;
      padding: 11px 28px; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #3561C0, #4A7BE0); color: #fff;
      box-shadow: 0 4px 15px rgba(53,97,192,0.2);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(53,97,192,0.3); }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-danger:hover { background: #c0392b; }
    .btn-outline { background: transparent; color: #3561C0; border: 2px solid #3561C0; }
    .btn-outline:hover { background: #f0f4ff; }
    .btn-sm { padding: 6px 14px; font-size: 13px; }
    .btn-group { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .product-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .product-table th {
      text-align: left; padding: 10px 8px; font-weight: 600; color: #888;
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #eee;
    }
    .product-table td { padding: 10px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    .product-table .actions { display: flex; gap: 6px; }
    .empty-state { text-align: center; padding: 40px 20px; color: #999; }
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #1a1a2e; color: #fff; padding: 12px 24px; border-radius: 10px;
      font-size: 14px; font-weight: 500; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    .login-box { max-width: 360px; margin: 80px auto; text-align: center; }
    .login-box h1 {
      font-size: 28px; margin-bottom: 8px;
      background: linear-gradient(135deg, #3561C0, #7B9CE5);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .login-box p { color: #888; margin-bottom: 24px; font-size: 15px; }
    .login-box .form-field { text-align: left; margin-bottom: 14px; }
    .login-box .btn { width: 100%; }
    .login-error { color: #e74c3c; font-size: 14px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div id="loginScreen" class="admin-wrap">
    <div class="login-box">
      <h1>cafe hb</h1>
      <p>Вход в панель управления</p>
      <div class="form-field">
        <label>Логин</label>
        <input type="text" id="loginUser" />
      </div>
      <div class="form-field">
        <label>Пароль</label>
        <input type="password" id="loginPassword" />
      </div>
      <button class="btn btn-primary" id="loginBtn">Войти</button>
      <div class="login-error" id="loginError">Неверный логин или пароль</div>
    </div>
  </div>

  <div id="adminPanel" style="display:none">
    <div class="admin-wrap">
      <div class="admin-header">
        <h1>Управление меню</h1>
        <div>
          <span id="settingsHint" style="color:#e67e22;font-size:13px;margin-right:12px"></span>
          <button class="btn btn-outline btn-sm" id="settingsBtn">Настройки</button>
          <button class="btn btn-outline btn-sm" id="logoutBtn">Выйти</button>
        </div>
      </div>

      <div id="setupCard" class="admin-card" style="display:none">
        <h2>Настройки jsonbin.io</h2>
        <p style="color:#888;font-size:14px;margin-bottom:16px">
          1. Зайди на <a href="https://jsonbin.io" target="_blank">jsonbin.io</a> → Register → создай bin с любыми данными<br>
          2. Скопируй <b>Bin ID</b> (из URL) и <b>X-Master-Key</b> (из вкладки API Keys)
        </p>
        <div class="form-grid">
          <div class="form-field full-width">
            <label>Bin ID</label>
            <input type="text" id="binId" placeholder="67c9a..." />
          </div>
          <div class="form-field full-width">
            <label>X-Master-Key</label>
            <input type="password" id="masterKey" placeholder="$2b$10$..." />
          </div>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="saveSettingsBtn">Сохранить</button>
          <button class="btn btn-outline" id="testSettingsBtn">Проверить</button>
        </div>
        <div id="settingsStatus" style="margin-top:10px;font-size:14px"></div>
      </div>

      <div class="admin-card">
        <h2>Добавить / Редактировать товар</h2>
        <form id="productForm">
          <div class="form-grid">
            <div class="form-field">
              <label for="category">Категория</label>
              <select id="category" required>
                <option value="drinks">Напитки</option>
                <option value="burgers">Бургеры</option>
                <option value="sandwiches">Сендвичи</option>
                <option value="salads">Салаты</option>
                <option value="dishes">Блюда</option>
                <option value="breakfast">Завтраки</option>
              </select>
            </div>
            <div class="form-field">
              <label for="price">Цена (c)</label>
              <input type="number" id="price" min="1" required />
            </div>
            <div class="form-field full-width">
              <label for="name">Название</label>
              <input type="text" id="name" required />
            </div>
            <div class="form-field full-width">
              <label for="image">Путь к изображению</label>
              <input type="text" id="image" placeholder="contant/Напитки/Лимонад.png" />
            </div>
            <div class="checkbox-field">
              <input type="checkbox" id="sizeMini" />
              <label for="sizeMini">Мини-карточка</label>
            </div>
          </div>
          <div class="btn-group">
            <button type="submit" class="btn btn-primary" id="saveBtn">Добавить</button>
            <button type="button" class="btn btn-outline" id="cancelEdit" style="display:none">Отмена</button>
          </div>
        </form>
      </div>

      <div class="admin-card">
        <h2>Все товары</h2>
        <div id="productsList"></div>
      </div>

      <div style="text-align:center;margin-top:20px">
        <a href="index.html" style="color:#3561C0;text-decoration:none;font-weight:600;font-size:15px">← На сайт</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "cafehb_products";

    let editingId = null;
    let loggedIn = false;

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }

    function getSettings() {
      try { return JSON.parse(localStorage.getItem("cafehb_settings")) || {}; }
      catch(e) { return {}; }
    }

    function saveSettings(s) {
      localStorage.setItem("cafehb_settings", JSON.stringify(s));
    }

    async function fetchFromJsonbin() {
      const s = getSettings();
      if (!s.binId) return null;
      const url = "https://api.jsonbin.io/v3/b/" + s.binId + "/latest";
      const res = await fetch(url, {
        headers: { "X-Bin-Meta": "false" }
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    }

    async function saveToJsonbin(data) {
      const s = getSettings();
      if (!s.binId || !s.masterKey) throw new Error("jsonbin.io не настроен");
      const url = "https://api.jsonbin.io/v3/b/" + s.binId;
      const res = await fetch(url, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": s.masterKey
        },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
    }

    async function getData() {
      try {
        const data = await fetchFromJsonbin();
        if (data) return data;
      } catch (e) {
        console.warn("jsonbin.io error, using local:", e);
      }
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : {};
    }

    async function saveData(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      try {
        await saveToJsonbin(items);
      } catch (e) {
        showToast("Сохранено локально, ошибка jsonbin.io: " + e.message);
        return;
      }
      showToast("Сохранено в jsonbin.io");
    }

    function updateSettingsHint() {
      const s = getSettings();
      const hint = document.getElementById("settingsHint");
      hint.textContent = s.binId ? "✓ jsonbin.io подключён" : "⚙ нужны настройки";
      hint.style.color = s.binId ? "#27ae60" : "#e67e22";
    }

    function renderList() {
      getData().then(data => {
        const container = document.getElementById("productsList");
        const categories = [
          { key: "drinks", title: "Напитки" },
          { key: "burgers", title: "Бургеры" },
          { key: "sandwiches", title: "Сендвичи" },
          { key: "salads", title: "Салаты" },
          { key: "dishes", title: "Блюда" },
          { key: "breakfast", title: "Завтраки" }
        ];

        let total = 0;
        categories.forEach(cat => { total += (data[cat.key] || []).length; });

        if (total === 0) {
          container.innerHTML = '<div class="empty-state">Товаров пока нет</div>';
          return;
        }

        let html = '<table class="product-table"><thead><tr><th>Категория</th><th>Название</th><th>Цена</th><th>Изобр.</th><th></th></tr></thead><tbody>';

        categories.forEach(cat => {
          const items = data[cat.key] || [];
          items.forEach((item, idx) => {
            html += '<tr>' +
              '<td>' + cat.title + '</td>' +
              '<td>' + item.name + (item.size === 'mini' ? ' <small style="color:#999">(мини)</small>' : '') + '</td>' +
              '<td>' + item.price + ' c</td>' +
              '<td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:#999">' + (item.image || '—') + '</td>' +
              '<td class="actions">' +
                '<button class="btn btn-outline btn-sm" onclick="editProduct(\'' + cat.key + '\',' + idx + ')">✎</button>' +
                '<button class="btn btn-danger btn-sm" onclick="deleteProduct(\'' + cat.key + '\',' + idx + ')">✕</button>' +
              '</td></tr>';
          });
        });

        html += '</tbody></table>';
        container.innerHTML = html;
      }).catch(e => {
        document.getElementById("productsList").innerHTML = '<div class="empty-state">Ошибка загрузки: ' + e.message + '</div>';
      });
    }

    document.getElementById("productForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const category = document.getElementById("category").value;
      const name = document.getElementById("name").value.trim();
      const price = parseInt(document.getElementById("price").value);
      const image = document.getElementById("image").value.trim();
      const sizeMini = document.getElementById("sizeMini").checked;

      if (!name || !price) return;

      const data = await getData();
      const product = { id: name, name, price };
      if (image) product.image = image;
      if (sizeMini) product.size = "mini";

      if (editingId) {
        const [catKey, idx] = editingId.split('-');
        data[catKey][parseInt(idx)] = product;
        editingId = null;
        document.getElementById("saveBtn").textContent = "Добавить";
        document.getElementById("cancelEdit").style.display = "none";
      } else {
        if (!data[category]) data[category] = [];
        data[category].push(product);
      }

      document.getElementById("productForm").reset();
      await saveData(data);
      renderList();
    });

    document.getElementById("cancelEdit").addEventListener("click", () => {
      editingId = null;
      document.getElementById("productForm").reset();
      document.getElementById("saveBtn").textContent = "Добавить";
      document.getElementById("cancelEdit").style.display = "none";
    });

    window.editProduct = async function(catKey, idx) {
      const data = await getData();
      const item = data[catKey][idx];
      if (!item) return;

      editingId = catKey + '-' + idx;
      document.getElementById("category").value = catKey;
      document.getElementById("name").value = item.name;
      document.getElementById("price").value = item.price;
      document.getElementById("image").value = item.image || "";
      document.getElementById("sizeMini").checked = item.size === "mini";
      document.getElementById("saveBtn").textContent = "Сохранить";
      document.getElementById("cancelEdit").style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.deleteProduct = async function(catKey, idx) {
      if (!confirm("Удалить этот товар?")) return;
      const data = await getData();
      data[catKey].splice(idx, 1);
      await saveData(data);
      renderList();
    };

    // Settings
    document.getElementById("settingsBtn").addEventListener("click", () => {
      const card = document.getElementById("setupCard");
      card.style.display = card.style.display === "none" ? "block" : "none";
      const s = getSettings();
      document.getElementById("binId").value = s.binId || "";
      document.getElementById("masterKey").value = s.masterKey || "";
    });

    document.getElementById("saveSettingsBtn").addEventListener("click", () => {
      const binId = document.getElementById("binId").value.trim();
      const masterKey = document.getElementById("masterKey").value.trim();
      if (!binId || !masterKey) { showToast("Заполни оба поля"); return; }
      saveSettings({ binId, masterKey });
      document.getElementById("setupCard").style.display = "none";
      updateSettingsHint();
      showToast("Настройки сохранены");
    });

    document.getElementById("testSettingsBtn").addEventListener("click", async () => {
      const status = document.getElementById("settingsStatus");
      status.textContent = "Проверяю...";
      status.style.color = "#888";
      try {
        const data = await fetchFromJsonbin();
        status.textContent = "✓ Подключение работает. Категорий: " + Object.keys(data).length;
        status.style.color = "#27ae60";
      } catch (e) {
        status.textContent = "✗ Ошибка: " + e.message;
        status.style.color = "#e74c3c";
      }
    });

    // Login
    function showAdmin() {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("adminPanel").style.display = "block";
      updateSettingsHint();
      renderList();
    }

    function showLogin() {
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("adminPanel").style.display = "none";
    }

    document.getElementById("loginBtn").addEventListener("click", () => {
      const user = document.getElementById("loginUser").value.trim();
      const pass = document.getElementById("loginPassword").value;
      if (user === "cafehb" && pass === "cafehbadmin") {
        loggedIn = true;
        showAdmin();
      } else {
        document.getElementById("loginError").style.display = "block";
      }
    });

    document.getElementById("loginPassword").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });
    document.getElementById("loginUser").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      loggedIn = false;
      document.getElementById("loginUser").value = "";
      document.getElementById("loginPassword").value = "";
      document.getElementById("loginError").style.display = "none";
      showLogin();
    });
  </script>
</body>
</html>
